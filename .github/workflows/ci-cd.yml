name: CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # =========================
  # CI
  # =========================
  test:
    name: CI - Test and Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python files
        run: |
          python -m py_compile app.py
          python -m py_compile config.py
          python -m py_compile models.py

      - name: Build Docker image
        run: |
          docker build \
            -t mayursaitwal/restaurant-image:latest \
            -t mayursaitwal/restaurant-image:${{ github.sha }} \
            .

  # =========================
  # CD
  # =========================
  push-image:
    name: CD - Push Docker Image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t mayursaitwal/restaurant-image:latest \
            -t mayursaitwal/restaurant-image:${{ github.sha }} \
            .

      - name: Push latest image
        run: |
          docker push mayursaitwal/restaurant-image:latest

      - name: Push versioned image
        run: |
          docker push mayursaitwal/restaurant-image:${{ github.sha }}