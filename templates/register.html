<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — Saveur Restaurant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card" style="max-width:500px">
    <div class="auth-logo">
      <h1>🍽 Saveur</h1>
      <p>Create your account</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="full_name" class="form-control" placeholder="Your full name" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" class="form-control" placeholder="email@example.com" required>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" name="phone" class="form-control" placeholder="10-digit number" required>
        </div>
      </div>
      <div class="form-group">
        <label>Address</label>
        <textarea name="address" class="form-control" rows="3" placeholder="House no, street, city, landmark" required></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" class="form-control" placeholder="Choose username" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" class="form-control" placeholder="Min 6 chars" required>
        </div>
      </div>
      <button type="submit" class="btn btn-gold btn-full" style="margin-top:0.5rem">Create Account</button>
    </form>

    <div class="auth-footer" style="margin-top:1.25rem">
      Already have an account? <a href="{{ url_for('customer_login') }}">Sign in</a>
    </div>
  </div>
</div>
</body>
</html>
