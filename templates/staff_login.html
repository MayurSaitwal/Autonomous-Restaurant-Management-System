<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Login — Saveur</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <h1>⚙️ Staff Portal</h1>
      <p>Saveur Restaurant — Staff Access</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label>Staff Username</label>
        <input type="text" name="username" class="form-control" placeholder="staff" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-gold btn-full" style="margin-top:0.5rem">Login as Staff</button>
    </form>

    <div class="auth-footer" style="margin-top:1rem">
      <a href="{{ url_for('customer_login') }}" style="color:var(--muted);font-size:0.8rem">← Customer Login</a>
    </div>

    <div style="margin-top:1.5rem; padding:0.75rem; background:rgba(201,168,76,0.06); border:1px solid var(--border); border-radius:8px; font-size:0.8rem; color:var(--muted);">
      Default credentials: <strong style="color:var(--gold-lt)">staff / admin123</strong>
    </div>
  </div>
</div>
</body>
</html>
